name: Universal Android APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-Extract ZIP if uploaded
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted_app
            unzip -o "$ZIP_FILE" -d extracted_app
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find Project, Generate Keystore & Build APK
        run: |
          if [ -d "extracted_app" ]; then
            cd extracted_app
          fi
          PROJECT_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: App code files inka upload cheyaledu!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK
          path: "**/build/outputs/apk/debug/*.apk"
